name: windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        ruby: [ 'mingw', 'mswin', '3.4' ]
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up Ruby
      uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Build package
      run: bundle exec rake build
    - name: Install package
      run: |
        gem install pkg/curses-*.gem
        ruby -r curses -e 'puts Curses::VERSION'
